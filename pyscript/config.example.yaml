# /config/pyscript/config.yaml
#
# configuration.yaml then only needs:
#   pyscript: !include pyscript/config.yaml
#
# Keeping the config under /config/pyscript means saving it reloads the
# apps without a Home Assistant restart. Check that both apps log
# "Reloaded": a failed reload leaves the old version running.

allow_all_imports: true
hass_is_global: true

apps:
  trip_scheduler:
    calendar_entity: calendar.tesla            # the Invite Calendar entity
    nominatim_user_agent: "my-ha-ev-scheduler/1.0 (contact: you@example.com)"
    geocode_cache: /config/pyscript/tesla_geocode_cache.json
    household_map: /config/pyscript/tesla_household.json
    # --- optional, defaults shown ---
    manual_trip_duration_min: 60               # event length in the member's calendar
    trip_list_days: 180                        # how far ahead the card's trip list looks

  ev_trip_energy:
    calendar_entity: calendar.tesla
    nominatim_user_agent: "my-ha-ev-scheduler/1.0 (contact: you@example.com)"   # same as above
    geocode_cache: /config/pyscript/tesla_geocode_cache.json                    # same file as above
    usable_battery_kwh: 79.0                   # your car's usable capacity
    safety_buffer_pct: 10                      # arrival buffer on top of the calculated need
    lookahead_days: 7
    default_notify_service: "notify.mobile_app_<your_phone>"   # NEVER notify.notify (broadcasts)
    # --- optional, defaults shown ---
    household_map: /config/pyscript/tesla_household.json
    alerted_path: /config/pyscript/tesla_trip_energy_alerted.json
    route_cache_path: /config/pyscript/tesla_route_cache.json
    efficiency_sensor: "sensor.tesla_adjusted_efficiency_wh_km"
    fallback_efficiency_wh_km: 153             # used when the efficiency sensor is unavailable
    prep_buffer_min: 15                        # time to get out of the door
    trip_cluster_hours: 12                     # trips this close together are budgeted together
    all_day_departure_hour: 8
    near_trip_hours: 6
    route_cache_hours: 6
    fallback_detour_factor: 1.3                # Waze down: road km = straight line km x this
    fallback_speed_kmh: 70                     # Waze down: assumed average speed
    idle_required_soc: 0
    floor_soc: 0                               # e.g. 50 keeps the car at least 50% while plugged in; 0 = off
    floor_ready_hour: 7
    soc_sensor: "sensor.<car>_battery_level"
    accept_invites: true                       # accept an invite once its location is found
